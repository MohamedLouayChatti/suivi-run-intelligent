<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clerk Playground — Swagger Token Minter</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      body {
        max-width: 640px;
        margin: 48px auto;
        padding: 0 20px;
      }
      h1 {
        font-size: 1.3rem;
        margin-bottom: 4px;
      }
      p.subtitle {
        color: #666;
        margin-top: 0;
        font-size: 0.9rem;
      }
      .card {
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 20px;
        margin-top: 20px;
      }
      #app {
        margin-top: 20px;
      }
      button {
        cursor: pointer;
        border: 1px solid #ccc;
        background: #f6f6f6;
        color: #111;
        border-radius: 6px;
        padding: 8px 14px;
        font-size: 0.9rem;
      }
      button:hover {
        background: #eee;
      }
      button.primary {
        background: #2563eb;
        border-color: #2563eb;
        color: #fff;
      }
      button.primary:hover {
        background: #1d4ed8;
      }
      button.danger {
        background: #fff;
        border-color: #c0392b;
        color: #c0392b;
      }
      button.danger:hover {
        background: #fdecea;
      }
      textarea {
        width: 100%;
        box-sizing: border-box;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.75rem;
        margin-top: 10px;
        padding: 8px;
        resize: vertical;
      }
      .row {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }
      .status {
        font-size: 0.85rem;
        color: #666;
        min-height: 1.2em;
      }
      .error {
        color: #c0392b;
      }
      code {
        background: #f0f0f0;
        padding: 1px 5px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <h1>Clerk Playground</h1>
    <p class="subtitle">
      Local sandbox for minting a <code>swagger</code>-template JWT to paste into Swagger UI's Authorize dialog.
      Not part of the app — do not deploy this.
    </p>

    <div class="card">
      <div id="app">Loading Clerk…</div>
    </div>

    <!--
      Frontend API script tags.
      Domain below is derived from the publishable key
      (pk_test_aW52aXRpbmctbWFydGVuLTI2LmNsZXJrLmFjY291bnRzLmRldiQ -> inviting-marten-26.clerk.accounts.dev).
      If you rotate keys or switch Clerk instances, regenerate this domain and swap it in both src attributes below.
    -->
    <script
      defer
      crossorigin="anonymous"
      src="https://inviting-marten-26.clerk.accounts.dev/npm/@clerk/ui@1/dist/ui.browser.js"
      type="text/javascript"
    ></script>

    <script
      defer
      crossorigin="anonymous"
      data-clerk-publishable-key="pk_test_aW52aXRpbmctbWFydGVuLTI2LmNsZXJrLmFjY291bnRzLmRldiQ"
      src="https://inviting-marten-26.clerk.accounts.dev/npm/@clerk/clerk-js@6/dist/clerk.browser.js"
      type="text/javascript"
    ></script>

    <script>
      // Name of the long-lived JWT template created in the Clerk Dashboard.
      const JWT_TEMPLATE_NAME = "swagger";

      function renderSignedOut() {
        const app = document.getElementById("app");
        app.innerHTML = `<div id="sign-in"></div>`;
        Clerk.mountSignIn(document.getElementById("sign-in"));
      }

      function renderSignedIn() {
        const user = Clerk.user;
        const app = document.getElementById("app");
        app.innerHTML = `
          <div class="row">
            <div id="user-button"></div>
            <span>Signed in as <strong>${user?.primaryEmailAddress?.emailAddress ?? user?.id}</strong></span>
            <button id="signout-btn" class="danger">Sign out</button>
          </div>
          <div class="row" style="margin-top: 16px;">
            <button id="mint-btn" class="primary">Get Swagger token</button>
            <button id="copy-btn" style="display:none;">Copy to clipboard</button>
          </div>
          <div class="status" id="status"></div>
          <textarea id="token-box" rows="6" readonly placeholder="Token will appear here…"></textarea>
        `;

        Clerk.mountUserButton(document.getElementById("user-button"));

        const statusEl = document.getElementById("status");
        const tokenBox = document.getElementById("token-box");
        const copyBtn = document.getElementById("copy-btn");

        document.getElementById("signout-btn").addEventListener("click", async () => {
          await Clerk.signOut();
          // Explicitly force the signed-out UI — signOut() also fires the
          // listener, but this avoids any timing gap waiting on that event.
          lastSignedIn = false;
          render();
        });

        document.getElementById("mint-btn").addEventListener("click", async () => {
          statusEl.textContent = "Fetching token…";
          statusEl.classList.remove("error");
          try {
            const token = await Clerk.session.getToken({ template: JWT_TEMPLATE_NAME });
            if (!token) {
              throw new Error(
                "getToken() returned null. Confirm a JWT template named '" + JWT_TEMPLATE_NAME + "' exists in the Clerk Dashboard."
              );
            }
            tokenBox.value = token;
            copyBtn.style.display = "inline-block";
            statusEl.textContent = "Token minted. Paste it into Swagger UI's Authorize dialog as a Bearer token.";
          } catch (err) {
            console.error(err);
            statusEl.textContent = "Error: " + err.message;
            statusEl.classList.add("error");
          }
        });

        copyBtn.addEventListener("click", async () => {
          await navigator.clipboard.writeText(tokenBox.value);
          statusEl.textContent = "Copied to clipboard.";
          statusEl.classList.remove("error");
        });
      }

      function render() {
        if (Clerk.isSignedIn) {
          renderSignedIn();
        } else {
          renderSignedOut();
        }
      }

      // Tracks the last *committed* signed-in state so we only remount the
      // UI on an actual sign-in/sign-out transition, not on every intermediate
      // Clerk client/session event (e.g. email submitted, code pending).
      // Remounting <SignIn/> mid-flow re-triggers the "send code" step, which
      // is what caused duplicate verification emails and the rate limit.
      let lastSignedIn = null;
      function handleClerkChange() {
        const signedIn = Boolean(Clerk.isSignedIn);
        if (signedIn === lastSignedIn) return;
        lastSignedIn = signedIn;
        render();
      }

      window.addEventListener("load", async function () {
        try {
          await Clerk.load({
            ui: { ClerkUI: window.__internal_ClerkUICtor },
          });
          lastSignedIn = Boolean(Clerk.isSignedIn);
          render();
          Clerk.addListener(handleClerkChange);
        } catch (err) {
          document.getElementById("app").innerHTML =
            '<p class="error">Failed to load Clerk: ' + err.message + "</p>";
          console.error(err);
        }
      });
    </script>
  </body>
</html>
