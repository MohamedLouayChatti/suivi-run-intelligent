[project]
name = "suivi-run-intelligent"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "pgvector>=0.5.0",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "clerk-backend-api>=6.0.1",
    "fastapi>=0.139.0",
    "pgvector>=0.3.6",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "sqlalchemy>=2.0.51",
    "svix>=1.97.0",
    "uvicorn>=0.51.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
