[project]
name = "suivi-run-intelligent"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    # The 3.x line, not the 4.x pre-release. Scheduling here is an in-process AsyncIOScheduler with
    # no job store: schedules are re-registered at startup from the table that owns them, so none
    # of 4.x's persistence or distributed-worker machinery is being waited on. 3.11 is also where
    # the pytz dependency gave way to the standard library's zoneinfo.
    "apscheduler>=3.11.3",
    "openpyxl>=3.1.5",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.19.0",
]

[dependency-groups]
dev = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "clerk-backend-api>=6.0.1",
    "fastapi>=0.139.0",
    "ipywidgets>=8.1.8",
    "matplotlib>=3.11.1",
    "nbclient>=0.11.0",
    "nbconvert>=7.17.1",
    "numpy>=2.5.2",
    # Reads the .xlsx/.xlsm uploads the batch import accepts alongside CSV. Pure Python, so it
    # needs no C toolchain -- which this development machine does not have, and which is what ruled
    # pgvector out. Imported lazily, on the one code path that uses it, so a deployment that has
    # not synced yet still starts and still accepts CSV.
    "openpyxl>=3.1.5",
    "ollama>=0.6.2",
    "pandas>=3.0.5",
    "psutil>=7.2.2",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "scikit-learn>=1.9.0",
    "sqlalchemy>=2.0.51",
    "svix>=1.97.0",
    "tqdm>=4.70.0",
    "umap-learn>=0.5.12",
    "uvicorn>=0.51.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
