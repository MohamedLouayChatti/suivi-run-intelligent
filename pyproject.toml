[project]
name = "suivi-run-intelligent"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "python-multipart>=0.0.32",
    "qdrant-client>=1.19.0",
]

[dependency-groups]
dev = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "clerk-backend-api>=6.0.1",
    "fastapi>=0.139.0",
    "ipywidgets>=8.1.8",
    "matplotlib>=3.11.1",
    "nbclient>=0.11.0",
    "nbconvert>=7.17.1",
    "numpy>=2.5.2",
    "ollama>=0.6.2",
    "pandas>=3.0.5",
    "psutil>=7.2.2",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "scikit-learn>=1.9.0",
    "sqlalchemy>=2.0.51",
    "svix>=1.97.0",
    "tqdm>=4.70.0",
    "umap-learn>=0.5.12",
    "uvicorn>=0.51.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
