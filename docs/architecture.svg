<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 770" width="1440" height="770" role="img" aria-label="Suivi RUN Intelligent high-level architecture">
<title>Suivi RUN Intelligent — High-level architecture</title>
<style>
  .t{font-family:'Segoe UI',Inter,'Helvetica Neue',Arial,Helvetica,sans-serif;fill:#14304C}
  .ttl{font-size:15px;font-weight:600}
  .box{font-size:12.5px;font-weight:600}
  .sub{font-size:9.5px;fill:#5A7086}
  .mod{font-size:11px;font-weight:600}
  .edge{font-size:9.5px;fill:#454545}
  .ext{fill:#3F4A55}
  .exts{font-size:9.5px;fill:#78828D}
  .note{font-size:9.5px;fill:#78828D;font-style:italic}
</style>
<defs>
  <marker id="a" markerWidth="8" markerHeight="8" refX="6.8" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#333333"/></marker>
  <marker id="ab" markerWidth="8" markerHeight="8" refX="0.2" refY="3.5" orient="auto"><path d="M7,0 L0,3.5 L7,7 Z" fill="#333333"/></marker>
</defs>

<rect x="0" y="0" width="1440" height="770" fill="#FFFFFF"/>

<text class="t ttl" x="60" y="42">Suivi RUN Intelligent — High-level architecture</text>

<!-- Web browser -->
<rect x="625" y="80" width="190" height="48" rx="3" fill="#E4EDF9" stroke="#6B8CB8" stroke-width="1.1"/>
<text class="t box" x="720" y="109" text-anchor="middle">Web Browser</text>

<line x1="720" y1="128" x2="720" y2="187" stroke="#333333" stroke-width="1.2" marker-end="url(#a)"/>
<text class="t edge" x="730" y="162">HTTPS</text>

<!-- Web application -->
<rect x="590" y="190" width="260" height="56" rx="3" fill="#E4EDF9" stroke="#6B8CB8" stroke-width="1.1"/>
<text class="t box" x="720" y="215" text-anchor="middle">Web Application</text>
<text class="t sub" x="720" y="231" text-anchor="middle">Next.js · React</text>

<!-- Clerk -->
<rect x="1090" y="190" width="210" height="56" rx="3" fill="#EFEFF1" stroke="#9AA3AE" stroke-width="1.1"/>
<text class="t box ext" x="1195" y="215" text-anchor="middle">Clerk</text>
<text class="t exts" x="1195" y="231" text-anchor="middle">identity provider</text>

<line x1="852" y1="218" x2="1086" y2="218" stroke="#333333" stroke-width="1.2" marker-end="url(#a)" marker-start="url(#ab)"/>
<rect x="931" y="206" width="42" height="12" fill="#FFFFFF"/>
<text class="t edge" x="952" y="215" text-anchor="middle">sign-in</text>

<line x1="720" y1="246" x2="720" y2="317" stroke="#333333" stroke-width="1.2" marker-end="url(#a)"/>
<text class="t edge" x="730" y="286">REST · SSE · JWT</text>

<line x1="1195" y1="246" x2="1195" y2="317" stroke="#333333" stroke-width="1.2" marker-end="url(#a)"/>
<text class="t edge" x="1205" y="286">webhooks</text>

<!-- ===== Application service ===== -->
<rect x="60" y="320" width="1320" height="230" rx="4" fill="#FFFFFF" stroke="#E08A2B" stroke-width="1.4"/>
<text class="t box" x="80" y="350" fill="#B5701C">Application Service<tspan class="sub" fill="#A98358"> — FastAPI, modular monolith</tspan></text>

<g fill="#E4EDF9" stroke="#6B8CB8" stroke-width="1.1">
  <rect x="80"     y="368" width="174" height="46" rx="3"/>
  <rect x="264.3"  y="368" width="174" height="46" rx="3"/>
  <rect x="448.7"  y="368" width="174" height="46" rx="3"/>
  <rect x="633"    y="368" width="174" height="46" rx="3"/>
  <rect x="817.3"  y="368" width="174" height="46" rx="3"/>
  <rect x="1001.7" y="368" width="174" height="46" rx="3"/>
  <rect x="1186"   y="368" width="174" height="46" rx="3"/>
</g>
<g class="t mod" text-anchor="middle">
  <text x="167"    y="396">Auth</text>
  <text x="351.3"  y="396">Ticket Management</text>
  <text x="535.7"  y="396">Knowledge Base</text>
  <text x="720"    y="396">Conversational Assistant</text>
  <text x="904.3"  y="396">Analytics</text>
  <text x="1088.7" y="396">Notifications</text>
  <text x="1273"   y="396">Audit</text>
</g>

<!-- bus spine -->
<g stroke="#333333" stroke-width="1.2">
  <line x1="167"    y1="414" x2="167"    y2="436"/>
  <line x1="351.3"  y1="414" x2="351.3"  y2="436"/>
  <line x1="535.7"  y1="414" x2="535.7"  y2="436"/>
  <line x1="720"    y1="414" x2="720"    y2="436"/>
  <line x1="904.3"  y1="414" x2="904.3"  y2="436"/>
  <line x1="1088.7" y1="414" x2="1088.7" y2="436"/>
  <line x1="1273"   y1="414" x2="1273"   y2="436"/>
  <line x1="167" y1="436" x2="1273" y2="436"/>
  <line x1="480" y1="436" x2="480" y2="467" marker-end="url(#a)"/>
  <line x1="960" y1="436" x2="960" y2="467" marker-end="url(#a)"/>
</g>

<rect x="280" y="470" width="400" height="54" rx="3" fill="#F2F6FC" stroke="#6B8CB8" stroke-width="1.1"/>
<text class="t box" x="480" y="494" text-anchor="middle">Domain Event Bus</text>
<text class="t sub" x="480" y="510" text-anchor="middle">in-process</text>

<rect x="760" y="470" width="400" height="54" rx="3" fill="#F2F6FC" stroke="#6B8CB8" stroke-width="1.1"/>
<text class="t box" x="960" y="494" text-anchor="middle">Background Jobs</text>
<text class="t sub" x="960" y="510" text-anchor="middle">queue · scheduler</text>

<!-- ===== storage and model services ===== -->
<g stroke="#333333" stroke-width="1.2">
  <line x1="270"  y1="550" x2="270"  y2="637" marker-end="url(#a)"/>
  <line x1="570"  y1="550" x2="570"  y2="637" marker-end="url(#a)"/>
  <line x1="870"  y1="550" x2="870"  y2="637" marker-end="url(#a)"/>
  <line x1="1170" y1="550" x2="1170" y2="637" marker-end="url(#a)"/>
</g>
<g class="t edge">
  <text x="280"  y="598">SQL</text>
  <text x="580"  y="598">file I/O</text>
  <text x="880"  y="598">REST</text>
  <text x="1180" y="598">HTTP</text>
</g>

<rect x="150" y="640" width="240" height="56" rx="3" fill="#E4EDF9" stroke="#6B8CB8" stroke-width="1.1"/>
<text class="t box" x="270" y="665" text-anchor="middle">PostgreSQL</text>
<text class="t sub" x="270" y="681" text-anchor="middle">relational database</text>

<rect x="450" y="640" width="240" height="56" rx="3" fill="#E4EDF9" stroke="#6B8CB8" stroke-width="1.1"/>
<text class="t box" x="570" y="665" text-anchor="middle">File Storage</text>
<text class="t sub" x="570" y="681" text-anchor="middle">attachments</text>

<rect x="750" y="640" width="240" height="56" rx="3" fill="#EFEFF1" stroke="#9AA3AE" stroke-width="1.1"/>
<text class="t box ext" x="870" y="665" text-anchor="middle">Qdrant Cloud</text>
<text class="t exts" x="870" y="681" text-anchor="middle">vector database</text>

<rect x="1050" y="640" width="240" height="56" rx="3" fill="#EFEFF1" stroke="#9AA3AE" stroke-width="1.1"/>
<text class="t box ext" x="1170" y="665" text-anchor="middle">Ollama</text>
<text class="t exts" x="1170" y="681" text-anchor="middle">embeddings · LLM</text>

<text class="t note" x="60" y="738">Grey boxes are external services.</text>
</svg>
